_subdirectory: template

_tasks:
  - "git init"
  - "mise trust"
  - "mise install"

tenant:
  type: str
  help: "Tenant slug (URL-friendly)"
  placeholder: "acme-corp"

github_org:
  type: str
  help: "GitHub org of the tenant (image registry owner and forge org)"
  default: "{{ tenant }}"

infrastructure:
  type: bool
  help: "Does this tenant build its own infrastructure layer (Proxmox hypervisor, backup server, ingress VM) instead of buying hosts from a provider?"
  default: false

ci_strategy:
  type: str
  help: "Where the tenant's CI jobs run (§ 8 PLX-Delivery), the same answer as its app repos': github, the forge's runners; on-prem, container slots on runner hosts of the tenant's own; hybrid, slots for the small and medium jobs and throwaway cloud instances for the large ones, whose daily sweep this repo mounts"
  default: github
  validator: "{% if ci_strategy not in ['github', 'on-prem', 'hybrid', 'forge', 'cloud'] %}ci_strategy is github, on-prem or hybrid{% endif %}"

# The strategy the templates act on. Until train 0.110.0 the answers were
# forge and cloud; an answers file that still says so is read as github and
# hybrid, since copier re-renders the old template with the stored answer
# and so cannot be handed a value the old template did not know. Never asked,
# never stored. The legacy values go once no consumer is below 0.111.0.
strategy:
  type: str
  default: "{{ {'forge': 'github', 'cloud': 'hybrid'}.get(ci_strategy, ci_strategy) }}"
  when: false

ci_registry:
  type: str
  help: "Where the app repos' runs keep the images they build and test (§ 8 PLX-Delivery): ghcr, the forge's registry, nothing to mount here; own, a registry on the tenant's object storage, whose monthly buckets this repo rotates"
  choices:
    - ghcr
    - own
  default: "{{ 'ghcr' if strategy == 'github' else 'own' }}"

ci_overlay:
  type: str
  help: "How a deploy of a third-party app reaches its host (§ 8 PLX-Delivery): none, as the inventory names it; netbird, over the tenant's overlay, which a job on the forge's runners joins for its length"
  choices:
    - none
    - netbird
  default: none

alerts_email:
  type: str
  help: "Hybrid strategy: the address the daily sweep mails when it removes an instance or a kept one is still there (empty: no mail); a fact, so an answer here and never a vault item"
  default: ""
  when: "{{ strategy == 'hybrid' }}"

renovate_reviewers:
  type: str
  help: "GitHub logins the update bot requests a review from on the PRs that wait for a human, comma-separated (empty: none); a PR the bot merges itself asks nobody unless its checks fail"
  default: ""
